[pytest]
testpaths = tests

# Custom markers (avoids PytestUnknownMarkWarning)
markers =
    unit: Pure unit tests — no external services required
    integration: Tests against mocked infra (Redis, Celery, Kafka)
    contract: Schema and event contract tests
    slow: Tests that are slow and excluded from fast CI runs

# Treat warnings as errors for internal code but allow third-party deprecations
filterwarnings =
    error::DeprecationWarning:app.*
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:langchain.*
    ignore::DeprecationWarning:ragas.*
    ignore::DeprecationWarning:celery.*
